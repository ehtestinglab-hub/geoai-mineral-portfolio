[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-mineral-portfolio"
version = "0.1.0"
description = "Applied geospatial data science and GeoAI portfolio for mineral exploration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["geoai*"]
